<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taskly</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <header class="site-header">
        <div class="header-bar">
            <h1>Taskly</h1>
            <nav class="site-nav">
                <ul>
                    <li>
                        <a class="site-nav_link" href="index.html" aria-current="page">Tasks</a>
                    </li>
                    <li>
                        <a class="site-nav_link" href="about.html" >About </a>
                    </li>
                </ul>
            </nav>
        </div>
    </header>
    <main class="site-main">
        <div class="main-container">

            <h1>My tasks</h1>
            <form class="todo-form">
                <input type="text" id="taskType" name="taskType" placeholder="What needs to be done?">
                <button type="submit" class="btn">Add</button>
            </form>
            <div class="task-condition">
                <button type="button">All</button>
                <button type="button">Active</button>
                <button type="button">Completed</button>
            </div>
            <ul class="todo-list">
                <li class="todo-item">
                    <input type="checkbox" id="task-1">
                    <label for="task-1">Buy milk</label>
                    <button type="button" class="todo-delete" aria-label="Delete task">×</button>
                </li>

            </ul>
        </div>
        <div>
            <p>Tasks left:</p>
        </div>
    </main>
   
    <footer class="site-footer">
        <span>Taskly, a practise project</span>
    </footer>
</body>
</html>
