<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taskly</title>
    <link rel="stylesheet" href="css/main.css">
    <script src="js/app.js" defer></script>

</head>
<body>
    <header class="site-header">
        <div class="header-bar container">
            <h1>Taskly</h1>
            <nav class="site-nav">
                <ul>
                    <li>
                        <a class="site-nav__link" href="index.html" aria-current="page">Tasks</a>
                    </li>
                    <li>
                        <a class="site-nav__link" href="about.html" >About </a>
                    </li>
                </ul>
            </nav>
        </div>
    </header>
    <main class="site-main">
        <div class="main-container container">

            <h1>My tasks</h1>
            <form class="todo-form" data-todo-form>
                <input type="text" id="taskType" name="taskType" placeholder="What needs to be done?" data-todo-input required>
                <button type="submit" class="btn">Add</button>
            </form>
            <div class="task-condition" data-todo-filters>
                <button type="button" data-filter="all" class="is-active" aria-pressed="true">All</button>
                <button type="button" data-filter="active" aria-pressed="false">Active</button>
                <button type="button" data-filter="completed" aria-pressed="false">Completed</button>
            </div>
            <ul class="todo-list" data-todo-list></ul>

            <template data-todo-template>
                <li class="todo-item">
                    <input type="checkbox" class="todo-item__checkbox" data-todo-toggle>
                    <label class="todo-item__title"></label>
                    <button type="button" class="todo-delete" aria-label="Delete task" data-todo-delete>×</button>
                </li>
            </template>

            <p class="todo-count" data-todo-count>Tasks left:</p>
        </div>
    </main>
   
    <footer class="site-footer">
        <span>Taskly, a practise project</span>
    </footer>
</body>
</html>
